name: Generate JoJo 2012 M3U (720p)

on:
  workflow_dispatch:
    inputs:
      resolution:
        description: 'Resolution to download'
        required: true
        default: '720p'
        type: choice
        options:
          - 360p
          - 480p
          - 720p

jobs:
  generate-m3u:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download batch ZIP
        env:
          RESOLUTION: ${{ github.event.inputs.resolution }}
        run: |
          case "$RESOLUTION" in
            360p) URL="https://pixeldrain.com/api/file/ApBTtMCs" ;;
            480p) URL="https://pixeldrain.com/api/file/qmkbjjRz" ;;
            720p) URL="https://pixeldrain.com/api/file/b5gcL8LM" ;;
          esac
          echo "Downloading $RESOLUTION from $URL"
          wget -q --show-progress -O "jojo2012_${RESOLUTION}.zip" "$URL"
          echo "ZIP size: $(du -h jojo2012_${RESOLUTION}.zip | cut -f1)"

      - name: Extract episodes
        env:
          RESOLUTION: ${{ github.event.inputs.resolution }}
        run: |
          mkdir -p jojo2012_${RESOLUTION}
          unzip -q "jojo2012_${RESOLUTION}.zip" -d "jojo2012_${RESOLUTION}"
          find "jojo2012_${RESOLUTION}" -type f \( -iname "*.mp4" -o -iname "*.mkv" -o -iname "*.avi" -o -iname "*.mov" \) | sort | while read f; do
            echo "$(basename "$f") $(du -h "$f" | cut -f1)"
          done

      - name: Generate M3U
        env:
          RESOLUTION: ${{ github.event.inputs.resolution }}
        run: |
          python3 << 'PYEOF'
          import os
          from pathlib import Path

          RESOLUTION = os.environ["RESOLUTION"]
          EXTRACT_DIR = Path(f"jojo2012_{RESOLUTION}")
          M3U_PATH = Path(f"jojo2012_{RESOLUTION}.m3u")

          EPISODE_TITLES = {
              1: "Phantom Blood - Episode 01: Dio the Invader",
              2: "Phantom Blood - Episode 02: A Letter from the Past",
              3: "Phantom Blood - Episode 03: The Youthful Knight",
              4: "Phantom Blood - Episode 04: Overdrive",
              5: "Phantom Blood - Episode 05: The Dark Knights",
              6: "Phantom Blood - Episode 06: The Courage to Face Death",
              7: "Phantom Blood - Episode 07: The Girl with the Blue Rose",
              8: "Phantom Blood - Episode 08: Bloody Battle! JoJo & Dio",
              9: "Phantom Blood - Episode 09: The Final Hamon",
              10: "Battle Tendency - Episode 10: New York's JoJo",
              11: "Battle Tendency - Episode 11: The Game Master",
              12: "Battle Tendency - Episode 12: The Warrior of the Colosseum",
              13: "Battle Tendency - Episode 13: JoJo vs. The Ultimate Lifeform",
              14: "Battle Tendency - Episode 14: The Ultimate Warrior",
              15: "Battle Tendency - Episode 15: The Warrior's Repose",
              16: "Battle Tendency - Episode 16: Lisa Lisa's Secret",
              17: "Battle Tendency - Episode 17: The Final Lesson",
              18: "Battle Tendency - Episode 18: The Ties That Bind",
              19: "Battle Tendency - Episode 19: The Warrior of Light",
              20: "Battle Tendency - Episode 20: The Ultimate Being",
              21: "Battle Tendency - Episode 21: The Birth of a Superbeing",
              22: "Battle Tendency - Episode 22: The Final Battle",
              23: "Battle Tendency - Episode 23: The Man Who Conquered the Sun",
              24: "Battle Tendency - Episode 24: The Rise of the Superbeing",
              25: "Battle Tendency - Episode 25: The Warrior's Farewell",
              26: "Battle Tendency - Episode 26: To the Future",
          }

          video_exts = {".mp4", ".mkv", ".avi", ".mov", ".mpg", ".mpeg", ".wmv", ".flv", ".webm"}
          files = sorted([p for p in EXTRACT_DIR.rglob("*") if p.suffix.lower() in video_exts], key=lambda p: p.name.lower())

          with open(M3U_PATH, "w", encoding="utf-8") as f:
              f.write("#EXTM3U\n")
              for i, vid in enumerate(files, 1):
                  title = EPISODE_TITLES.get(i, f"Episode {i:02d}")
                  # Placeholder URL - user replaces with actual hosting URL
                  url = f"https://YOUR_HOSTING_URL/{vid.name}"
                  f.write(f'#EXTINF:-1 tvg-id="jojo2012-{i:02d}" tvg-name="{title}",{title}\n')
                  f.write(f"{url}\n")
          print(f"Generated {M3U_PATH} with {len(files)} entries")
          PYEOF

      - name: Upload M3U as artifact
        uses: actions/upload-artifact@v4
        with:
          name: jojo2012-${{ github.event.inputs.resolution }}-m3u
          path: jojo2012_${{ github.event.inputs.resolution }}.m3u
          retention-days: 7

      - name: Show M3U preview
        env:
          RESOLUTION: ${{ github.event.inputs.resolution }}
        run: |
          echo "=== M3U Preview (first 30 lines) ==="
          head -30 "jojo2012_${RESOLUTION}.m3u"
          echo "..."
          echo "Total lines: $(wc -l < jojo2012_${RESOLUTION}.m3u)"