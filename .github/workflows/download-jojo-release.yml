name: Download JoJo 2012 Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      resolution:
        description: Resolution to build
        required: false
        default: 720p
      create_release:
        description: Create GitHub Release with videos
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  download-extract-release:
    name: Download, Extract & Release
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests tqdm

      - name: Download batch ZIP
        id: download
        run: |
          mkdir -p /tmp/jojo
          cd /tmp/jojo

          resolution="${{ inputs.resolution || vars.JOJO_RESOLUTION }}"
          if [ -z "$resolution" ]; then
            resolution="720p"
          fi

          cat > download.py << 'ENDOFSCRIPT'
          import os
          import json

          urls = {
              '360p': 'https://pixeldrain.com/api/file/ApBTtMCs',
              '480p': 'https://pixeldrain.com/api/file/qmkbjjRz',
              '720p': 'https://pixeldrain.com/api/file/b5gcL8LM',
          }

          resolution = os.environ.get('JOJO_RESOLUTION', '720p')
          url = urls[resolution]
          filename = f'Alqanime_Jojo_BD_{resolution}.zip'

          print(f'Downloading {url}')
          import requests
          r = requests.get(url, stream=True, timeout=7200)
          r.raise_for_status()
          with open(filename, 'wb') as f:
              for chunk in r.iter_content(chunk_size=8192):
                  f.write(chunk)
          size = os.path.getsize(filename)
          print(f'Downloaded {filename} ({size} bytes)')
          print(f'zip_path=/tmp/jojo/{filename}')
          ENDOFSCRIPT

          JOJO_RESOLUTION="$resolution" python3 download.py >> $GITHUB_OUTPUT

      - name: Extract episodes
        id: extract
        run: |
          cd /tmp/jojo
          unzip -o "${{ steps.download.outputs.zip_path }}" -d episodes

          find episodes -type f \( -iname "*.mp4" -o -iname "*.mkv" -o -iname "*.avi" \) | sort | head -26 > video_files.txt

          count=$(wc -l < video_files.txt)
          echo "Found $count video files"

          if [ "$count" -lt 26 ]; then
            echo "::warning::Expected 26 episodes, found $count"
          fi

          mkdir -p ${{ github.workspace }}/release_assets
          cp $(cat video_files.txt) ${{ github.workspace }}/release_assets/

          echo "asset_dir=${{ github.workspace }}/release_assets" >> $GITHUB_OUTPUT
          echo "count=$count" >> $GITHUB_OUTPUT

      - name: Generate M3U with release URLs
        id: generate_m3u
        run: |
          resolution="${{ inputs.resolution || vars.JOJO_RESOLUTION }}"
          if [ -z "$resolution" ]; then
            resolution="720p"
          fi
          
          create_release="${{ inputs.create_release || vars.JOJO_CREATE_RELEASE }}"
          if [ -z "$create_release" ]; then
            create_release="true"
          fi

          if [ "$create_release" != "true" ]; then
            echo "create_release=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "create_release=true" >> $GITHUB_OUTPUT

          cat > generate_m3u.py << 'ENDOFSCRIPT'
          import os

          repo = os.environ.get('GITHUB_REPOSITORY', '')
          run_number = os.environ.get('GITHUB_RUN_NUMBER', '1')
          resolution = os.environ.get('JOJO_RESOLUTION', '720p')
          release_tag = f'jojo2012-{resolution}-{run_number}'
          base_url = f'https://github.com/{repo}/releases/download/{release_tag}/'

          m3u_file = f'jojo2012-{resolution}.m3u'
          asset_dir = os.environ.get('ASSET_DIR', 'release_assets')

          files = sorted(os.listdir(asset_dir))

          with open(m3u_file, 'w') as f:
              f.write('#EXTM3U\n')
              for i, filename in enumerate(files):
                  ep = i + 1
                  if ep <= 9:
                      part = 'Phantom Blood'
                      ep_display = f'{ep:02d}'
                  else:
                      part = 'Battle Tendency'
                      ep_display = f'{ep - 9:02d}'

                  url = base_url + filename
                  f.write(f'#EXTINF:-1 tvg-id="jojo2012-{ep}" tvg-name="{part} - Episode {ep_display}",{part} - Episode {ep_display}\n')
                  f.write(f'{url}\n')

          print(f'Generated M3U with {len(files)} entries')
          print(f'release_tag={release_tag}')
          print(f'm3u_file={m3u_file}')
          ENDOFSCRIPT

          JOJO_RESOLUTION="$resolution" ASSET_DIR="${{ github.workspace }}/release_assets" python3 generate_m3u.py >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: ${{ steps.generate_m3u.outputs.create_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.generate_m3u.outputs.release_tag }}
          name: "JoJo 2012 ${{ inputs.resolution || vars.JOJO_RESOLUTION || '720p' }} (Episodes 1-26)"
          body: |
            JoJo's Bizarre Adventure 2012 - ${{ vars.JOJO_RESOLUTION || '720p' }}
            
            Episodes 1-9: Phantom Blood
            Episodes 10-26: Battle Tendency
            
            Source: Alqanime (BD, Indonesian hard-subs)
            Downloaded from PixelDrain batch ZIP
            
            Generated on ${{ github.run_id }}
          files: ${{ steps.extract.outputs.asset_dir }}/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit M3U to repo
        if: ${{ steps.generate_m3u.outputs.create_release == 'true' }}
        run: |
          cd ${{ github.workspace }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add "${{ steps.generate_m3u.outputs.m3u_file }}"
          
          if git diff --staged --quiet; then
            echo "No M3U changes"
          else
            git commit -m "Add ${{ inputs.resolution || vars.JOJO_RESOLUTION || '720p' }} M3U with release URLs"
            git push origin main
            echo "M3U committed and pushed"
          fi

      - name: Summary
        run: |
          echo "## Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Resolution: ${{ inputs.resolution || vars.JOJO_RESOLUTION || '720p' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Episodes found: ${{ steps.extract.outputs.count }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.generate_m3u.outputs.create_release }}" = "true" ]; then
            echo "- Release: ${{ steps.generate_m3u.outputs.release_tag }}" >> $GITHUB_STEP_SUMMARY
            echo "- M3U: ${{ steps.generate_m3u.outputs.m3u_file }}" >> $GITHUB_STEP_SUMMARY
            echo "- Release URL: https://github.com/${{ github.repository }}/releases/tag/${{ steps.generate_m3u.outputs.release_tag }}" >> $GITHUB_STEP_SUMMARY
          fi
