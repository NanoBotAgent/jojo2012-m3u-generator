name: Download JoJo 2012 720p & Create Release

on:
  workflow_dispatch:
    inputs:
      resolution:
        description: 'Resolution to download'
        required: true
        default: '720p'
        type: choice
        options:
          - 360p
          - 480p
          - 720p
      create_release:
        description: 'Create GitHub Release with episodes as assets'
        required: false
        default: 'true'
        type: string

permissions:
  contents: write

jobs:
  download-extract-release:
    name: Download, Extract & Release
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests tqdm

      - name: Download batch ZIP
        id: download
        env:
          JOJO_RESOLUTION: ${{ inputs.resolution }}
          JOJO_WORK_DIR: /tmp/jojo
        run: python3 scripts/download_release.py

      - name: Extract episodes
        id: extract
        env:
          ZIP_PATH: ${{ steps.download.outputs.zip_path }}
          ASSET_DIR: ${{ github.workspace }}/release_assets
        run: |
          mkdir -p /tmp/jojo
          unzip -o "$ZIP_PATH" -d /tmp/jojo/episodes

          find /tmp/jojo/episodes -type f \( -iname "Alqanime_Jojo_BD_*.mp4" -o -iname "Alqanime_Jojo_BD_*.mkv" -o -iname "Alqanime_Jojo_BD_*.avi" \) | sort | head -26 > /tmp/jojo/video_files.txt

          count=$(wc -l < /tmp/jojo/video_files.txt)
          echo "Found $count video files"

          if [ "$count" -lt 26 ]; then
            echo "::warning::Expected 26 episodes, found $count"
          fi

          mkdir -p "$ASSET_DIR"
          while IFS= read -r video; do
            cp "$video" "$ASSET_DIR/"
          done < /tmp/jojo/video_files.txt

          echo "asset_dir=$ASSET_DIR" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Generate M3U with release URLs
        id: generate_m3u
        env:
          JOJO_RESOLUTION: ${{ inputs.resolution }}
          ASSET_DIR: ${{ steps.extract.outputs.asset_dir }}
          M3U_FILE: jojo2012-${{ inputs.resolution }}.m3u
        run: python3 scripts/generate_release_m3u.py

      - name: Create GitHub Release
        if: ${{ inputs.create_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.generate_m3u.outputs.release_tag }}
          name: "JoJo 2012 ${{ inputs.resolution }} (Episodes 1-26)"
          body: |
            JoJo's Bizarre Adventure 2012 - ${{ inputs.resolution }}

            Episodes 1-9: Phantom Blood
            Episodes 10-26: Battle Tendency

            Source: Alqanime (BD, Indonesian hard-subs)
            Downloaded from PixelDrain batch ZIP

            Generated on ${{ github.run_id }}
          files: ${{ steps.extract.outputs.asset_dir }}/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit M3U to repo
        if: ${{ inputs.create_release == 'true' }}
        env:
          M3U_FILE: ${{ steps.generate_m3u.outputs.m3u_file }}
          RESOLUTION: ${{ inputs.resolution }}
        run: |
          cd "${{ github.workspace }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "$M3U_FILE"

          if git diff --staged --quiet; then
            echo "No M3U changes"
          else
            git commit -m "Add $RESOLUTION M3U with release URLs"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "M3U committed and pushed"
          fi

      - name: Summary
        env:
          RESOLUTION: ${{ inputs.resolution }}
          EPISODE_COUNT: ${{ steps.generate_m3u.outputs.episode_count }}
          RELEASE_TAG: ${{ steps.generate_m3u.outputs.release_tag }}
          M3U_FILE: ${{ steps.generate_m3u.outputs.m3u_file }}
        run: |
          {
            echo "## Summary"
            echo "- Resolution: $RESOLUTION"
            echo "- Episodes found: ${{ steps.extract.outputs.count }}"
            if [ "${{ inputs.create_release }}" = "true" ]; then
              echo "- Release: $RELEASE_TAG"
              echo "- M3U: $M3U_FILE"
              echo "- Release URL: https://github.com/${{ github.repository }}/releases/tag/$RELEASE_TAG"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
