name: Download JoJo 2012 720p & Create Release

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release with episodes as assets'
        required: false
        default: 'true'
        type: string
      stream_from_remote:
        description: 'Read episodes straight from the remote archive (slower, less disk)'
        required: false
        default: 'false'
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Publish 720p Release
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Report runner disk space
        run: |
          echo "### Runner disk" >> "$GITHUB_STEP_SUMMARY"
          df -h / /tmp >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOJO_RESOLUTION: '720p'
          CREATE_RELEASE: ${{ inputs.create_release }}
          STREAM_FROM_REMOTE: ${{ inputs.stream_from_remote }}
          M3U_FILE: jojo2012-720p.m3u
        run: python3 scripts/publish_release.py

      - name: Commit M3U to repo
        if: ${{ inputs.create_release == 'true' }}
        env:
          M3U_FILE: ${{ steps.publish.outputs.m3u_file }}
          RESOLUTION: '720p'
        run: |
          cd "${{ github.workspace }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "$M3U_FILE"

          if git diff --staged --quiet; then
            echo "No M3U changes"
          else
            git commit -m "Add $RESOLUTION M3U with release URLs"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "M3U committed and pushed"
          fi

      - name: Summary
        env:
          EPISODE_COUNT: ${{ steps.publish.outputs.episode_count }}
          RELEASE_TAG: ${{ steps.publish.outputs.release_tag }}
          RELEASE_URL: ${{ steps.publish.outputs.release_url }}
          M3U_FILE: ${{ steps.publish.outputs.m3u_file }}
        run: |
          {
            echo "## Summary"
            echo "- Resolution: 720p"
            echo "- Episodes: $EPISODE_COUNT"
            if [ "${{ inputs.create_release }}" = "true" ]; then
              echo "- Release: $RELEASE_URL"
              echo "- M3U: $M3U_FILE"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
