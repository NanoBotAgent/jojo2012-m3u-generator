name: Download and Commit JoJo 2012 Videos

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  download-and-commit:
    name: Download Videos & Update M3U
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository with LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Install Git LFS
        run: |
          git lfs install
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Configure Git LFS tracking for video files
        run: |
          git lfs track "*.mp4"
          git add .gitattributes

      - name: Parse video URLs
        run: |
          video_urls="${{ vars.VIDEO_URLS }}"
          if [ -n "$video_urls" ]; then
            echo "$video_urls" > video_urls.json
          else
            echo '[]' > video_urls.json
            echo "::warning::No video URLs provided. Set VIDEO_URLS repository variable."
          fi
          cat video_urls.json

      - name: Download videos
        run: python3 scripts/download_videos.py

      - name: Generate M3U
        run: |
          GITHUB_REPOSITORY="${{ github.repository }}" python3 scripts/generate_m3u.py

      - name: Commit changes
        run: |
          git add .gitattributes videos/*.mp4 jojo2012-720p.m3u
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          else
            git commit -m "Add JoJo 2012 720p videos and update M3U"
            git push origin main
            echo "Pushed changes to main branch"
          fi

      - name: Summary
        run: |
          echo "## Download Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Videos downloaded: $(ls -1 videos/*.mp4 2>/dev/null | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "- M3U updated with GitHub raw URLs" >> $GITHUB_STEP_SUMMARY
          echo "- Repository: ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** GitHub LFS raw URLs serve pointer files. For direct video streaming," >> $GITHUB_STEP_SUMMARY
          echo "consider using GitHub Releases assets or a CDN instead." >> $GITHUB_STEP_SUMMARY