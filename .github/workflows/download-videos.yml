name: Download and Commit JoJo 2012 Videos

on:
  workflow_dispatch:
    inputs:
      video_urls:
        description: 'JSON array of video URLs for episodes 1-26 (or provide via repository variable VIDEO_URLS)'
        required: false
        type: string
      commit_message:
        description: 'Commit message'
        required: false
        default: 'Add JoJo 2012 720p videos and update M3U'
        type: string
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  download-and-commit:
    name: Download Videos & Update M3U
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository with LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Install Git LFS
        run: |
          git lfs install
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Configure Git LFS tracking for video files
        run: |
          git lfs track "*.mp4"
          git add .gitattributes

      - name: Parse video URLs
        id: parse_urls
        run: |
          if [ -n "${{ github.event.inputs.video_urls }}" ]; then
            echo "${{ github.event.inputs.video_urls }}" > video_urls.json
          elif [ -n "${{ vars.VIDEO_URLS }}" ]; then
            echo "${{ vars.VIDEO_URLS }}" > video_urls.json
          else
            echo '[]' > video_urls.json
            echo "::warning::No video URLs provided. Set VIDEO_URLS repository variable or provide via workflow_dispatch input."
          fi
          cat video_urls.json

      - name: Download videos
        id: download
        run: |
          cat > download_videos.py << 'PYEOF'
import os
import json
import requests
import sys

with open('video_urls.json') as f:
    urls = json.load(f)

os.makedirs('videos', exist_ok=True)
os.chdir('videos')

for i, url in enumerate(urls):
    ep = i + 1
    if not url or url == "null":
        print(f"Skipping empty URL for episode {ep}")
        continue

    filename = f"Alqanime_Jojo_BD_{ep}_720p.mp4"
    if ep == 26:
        filename = "Alqanime_Jojo_BD_26_END_720p.mp4"

    print(f"Downloading episode {ep} from {url}")
    print(f"Saving as {filename}")

    try:
        r = requests.get(url, stream=True, timeout=3600)
        r.raise_for_status()
        with open(filename, 'wb') as f:
            for chunk in r.iter_content(chunk_size=8192):
                f.write(chunk)
        size = os.path.getsize(filename)
        print(f"Downloaded {filename} ({size} bytes)")
    except Exception as e:
        print(f"::error::Failed to download episode {ep}: {e}")
        sys.exit(1)

print("videos_dir=videos")
PYEOF
          python3 download_videos.py >> $GITHUB_OUTPUT

      - name: Update M3U with GitHub raw URLs
        id: update_m3u
        run: |
          cat > generate_m3u.py << 'PYEOF'
import os

repo = "${{ github.repository }}"
m3u_file = "jojo2012-720p.m3u"

with open(m3u_file, 'w') as f:
    f.write("#EXTM3U\n")
    for ep in range(1, 27):
        if ep <= 9:
            part = "Phantom Blood"
            ep_display = f"{ep:02d}"
        else:
            part = "Battle Tendency"
            ep_display = f"{ep - 9:02d}"

        filename = f"Alqanime_Jojo_BD_{ep}_720p.mp4"
        if ep == 26:
            filename = "Alqanime_Jojo_BD_26_END_720p.mp4"

        raw_url = f"https://media.githubusercontent.com/media/{repo}/main/videos/{filename}"

        f.write(f'#EXTINF:-1 tvg-id="jojo2012-{ep}" tvg-name="{part} - Episode {ep_display}",{part} - Episode {ep_display}\n')
        f.write(f'{raw_url}\n')

count = sum(1 for _ in open(m3u_file) if _.startswith('https://'))
print(f"Updated M3U with {count} video entries")
PYEOF
          python3 generate_m3u.py

      - name: Commit changes
        run: |
          git add .gitattributes videos/*.mp4 jojo2012-720p.m3u
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "${{ github.event.inputs.commit_message }}"
            git push origin main
            echo "Pushed changes to main branch"
          fi

      - name: Summary
        run: |
          echo "## Download Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Videos downloaded: $(ls -1 videos/*.mp4 2>/dev/null | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "- M3U updated with GitHub raw URLs" >> $GITHUB_STEP_SUMMARY
          echo "- Repository: ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** GitHub LFS raw URLs serve pointer files. For direct video streaming," >> $GITHUB_STEP_SUMMARY
          echo "consider using GitHub Releases assets or a CDN instead." >> $GITHUB_STEP_SUMMARY