name: Probe Subtitle Tracks

on:
  workflow_dispatch:
    inputs:
      candidates:
        description: 'Comma separated nyaa torrent IDs to probe'
        required: false
        default: '1299586,1681123'
      maxwait:
        description: 'Seconds to wait for each episode file to complete'
        required: false
        default: '1200'

permissions:
  contents: read

jobs:
  probe:
    name: Probe subtitle tracks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg and aria2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg aria2
          echo "ffprobe: $(command -v ffprobe || echo MISSING)"
          echo "aria2c : $(command -v aria2c || echo MISSING)"
          ffprobe -version 2>/dev/null | head -1
          df -h / /tmp | sed 's/^/  /'

      - name: Probe each candidate
        env:
          CANDIDATES: ${{ inputs.candidates }}
          MAXWAIT: ${{ inputs.maxwait }}
        run: |
          set -u
          mkdir -p /tmp/probe/frames /tmp/probe/srt
          cd /tmp/probe
          for ID in ${CANDIDATES//,/ }; do
            ID=$(echo "$ID" | tr -d ' ')
            [ -z "$ID" ] && continue
            echo "================= candidate $ID ================="
            curl -sSL --max-time 90 -A "Mozilla/5.0" "https://nyaa.si/download/$ID.torrent" -o "$ID.torrent" || true
            if [ ! -s "$ID.torrent" ]; then
              echo "  !! torrent fetch failed"
              continue
            fi
            aria2c --show-files "$ID.torrent" 2>/dev/null > "$ID.files"
            echo "  --- file listing sample ---"
            head -6 "$ID.files" | sed 's/^/    /'
            echo "  --- picking episode 1 ---"
            python3 - "$ID.files" <<'PYEOF' > "$ID.pick"
          import re, sys
          rows = []
          for line in open(sys.argv[1], encoding='utf-8', errors='replace'):
              line = line.rstrip('\n')
              if '|' not in line:
                  continue
              parts = line.split('|')
              if len(parts) < 3:
                  continue
              idx = parts[0].strip()
              path = parts[1].strip()
              try:
                  size = int(parts[2].strip())
              except ValueError:
                  continue
              if not idx.isdigit():
                  continue
              rows.append((int(idx), path, size))
          excl = re.compile(r'OVA|NCOP|NCED|Promo|Special|Extra|Menu|Preview|Commentary', re.I)
          def ok(p):
              return not excl.search(p)
          picks = []
          for pat in (r'S01E0?1\b', r'Season 01.*[-_ ]0?1\.(mkv|mp4)$', r'Part 0?1.*[-_ ]0?1\.(mkv|mp4)$',
                      r'[-_ ]0?1\.(mkv|mp4)$'):
              picks = [r for r in rows if re.search(pat, r[1], re.I) and ok(r[1])]
              if picks:
                  break
          if not picks:
              picks = [r for r in rows if ok(r[1]) and r[1].lower().endswith(('.mkv', '.mp4'))]
          if not picks:
              print('NONE')
              raise SystemExit
          picks.sort(key=lambda r: (len(r[1]), r[0]))
          idx, path, size = picks[0]
          print(idx)
          print(path)
          print(size)
          print(path.split('/')[-1])
          PYEOF
            IDX=$(sed -n 1p "$ID.pick")
            if [ "$IDX" = "NONE" ]; then
              echo "  !! no episode file found"
              continue
            fi
            FNAME=$(sed -n 2p "$ID.pick")
            FSIZE=$(sed -n 3p "$ID.pick")
            BASENAME=$(sed -n 4p "$ID.pick")
            echo "  picked index=$IDX size=$FSIZE file=$FNAME"
            mkdir -p "d$ID"
            aria2c --dir="d$ID" --select-file="$IDX" --allow-overwrite=true \
              --auto-file-renaming=false --file-allocation=none --bt-enable-lpd=true \
              --bt-tracker="udp://tracker.opentrackr.org:1337/announce" \
              --bt-tracker="udp://open.stealth.si:80/announce" \
              --bt-tracker="udp://tracker.torrent.eu.org:451/announce" \
              --bt-tracker="udp://exodus.desync.com:6969/announce" \
              --bt-tracker="udp://tracker.coppersurfer.tk:6969/announce" \
              --connect-timeout=30 --timeout=60 --summary-interval=20 \
              --console-log-level=warn --log="$ID.aria2.log" \
              "$ID.torrent" > "$ID.aria2.out" 2>&1 &
            ARIA_PID=$!
            DEADLINE=$(( $(date +%s) + MAXWAIT ))
            while [ "$(date +%s)" -lt "$DEADLINE" ]; do
              if ! kill -0 "$ARIA_PID" 2>/dev/null; then break; fi
              sleep 5
            done
            kill "$ARIA_PID" 2>/dev/null || true
            wait "$ARIA_PID" 2>/dev/null || true
            echo "  --- files on disk ---"
            find "d$ID" -type f -printf '    %12s  %f\n' | sort -k2 | head -8
            FOUND=$(find "d$ID" -type f -name "*${BASENAME}" -size +1M | head -1)
            if [ -z "$FOUND" ]; then
              FOUND=$(find "d$ID" -type f -size +10M | head -1)
            fi
            if [ -z "$FOUND" ]; then
              echo "  !! no episode file downloaded"
              tail -14 "$ID.aria2.log" 2>/dev/null | sed 's/^/     /'
              continue
            fi
            echo "  probing: $FOUND ($(stat -c%s "$FOUND") bytes)"
            {
              echo ""
              echo "### candidate $ID"
              echo "- file: $FNAME"
              echo ""
              echo '```'
              ffprobe -v error -show_entries stream=index,codec_type,codec_name,width,height:stream_tags=language,title -of default=nw=1 "$FOUND"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "  --- all streams ---"
            ffprobe -v error -show_entries stream=index,codec_type,codec_name,width,height:stream_tags=language,title -of default=nw=1 "$FOUND" | sed 's/^/     /'
            echo "  --- subtitle tracks only ---"
            ffprobe -v error -select_streams s -show_entries stream=index,codec_name:stream_tags=language,title -of default=nw=1 "$FOUND" | sed 's/^/     /'
            echo "  --- extract subtitle tracks ---"
            for S in $(ffprobe -v error -select_streams s -show_entries stream=index -of csv=p=0 "$FOUND"); do
              TAGS=$(ffprobe -v error -select_streams "s:$S" -show_entries stream_tags=language,title -of default=nw=1 "$FOUND" | tr '\n' ' ')
              ffmpeg -v error -y -i "$FOUND" -map "0:$S" "srt/${ID}_s${S}.srt" 2>&1 | head -2 || true
              SZ=$(stat -c%s "srt/${ID}_s${S}.srt" 2>/dev/null || echo 0)
              echo "     stream $S  tags=[$TAGS]  extracted=${SZ}B"
            done
            ls -l srt/ | tail -8 | sed 's/^/     /'
            STEM="frames/${ID}"
            ffmpeg -v error -y -ss 420 -i "$FOUND" -frames:v 1 "${STEM}_a.png" 2>&1 | head -2 || true
            ffmpeg -v error -y -ss 1200 -i "$FOUND" -frames:v 1 "${STEM}_b.png" 2>&1 | head -2 || true
            ls -l frames/ | tail -6 | sed 's/^/     /'
            rm -rf "d$ID"
          done
          echo ""
          echo "### frames"; ls -l frames/ | sed 's/^/  /'
          echo "### srt";   ls -l srt/   | sed 's/^/  /'

      - name: Upload frames and srt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subtitle-probe
          path: |
            /tmp/probe/frames/
            /tmp/probe/srt/
          if-no-files-found: ignore
