name: Probe Subtitle Tracks

on:
  workflow_dispatch:
    inputs:
      candidates:
        description: 'Comma separated nyaa torrent IDs to probe'
        required: false
        default: '1299586,1681123'
      target:
        description: 'Substring of the episode file to pick (basename)'
        required: false
        default: 'S01E01'
      maxwait:
        description: 'Seconds to wait for the episode file to complete'
        required: false
        default: '1200'

permissions:
  contents: read

jobs:
  probe:
    name: Probe subtitle tracks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg and aria2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg aria2
          echo "ffprobe: $(command -v ffprobe || echo MISSING)"
          echo "aria2c : $(command -v aria2c || echo MISSING)"
          ffprobe -version 2>/dev/null | head -1
          df -h / /tmp | sed 's/^/  /'

      - name: Probe each candidate
        env:
          CANDIDATES: ${{ inputs.candidates }}
          TARGET: ${{ inputs.target }}
          MAXWAIT: ${{ inputs.maxwait }}
        run: |
          set -u
          mkdir -p /tmp/probe/frames
          cd /tmp/probe
          for ID in ${CANDIDATES//,/ }; do
            ID=$(echo "$ID" | tr -d ' ')
            [ -z "$ID" ] && continue
            echo "================= candidate $ID ================="
            curl -sSL --max-time 90 -A "Mozilla/5.0" "https://nyaa.si/download/$ID.torrent" -o "$ID.torrent" || true
            if [ ! -s "$ID.torrent" ]; then
              echo "  !! torrent fetch failed"
              continue
            fi
            echo "  --- aria2 file listing (first 20) ---"
            aria2c --show-files "$ID.torrent" 2>/dev/null | head -20 | sed 's/^/    /'
            echo "  --- picking file matching '$TARGET' ---"
            LINE=$(aria2c --show-files "$ID.torrent" 2>/dev/null | grep -F "$TARGET" | head -1)
            if [ -z "$LINE" ]; then
              echo "  !! no file matching '$TARGET'"
              continue
            fi
            IDX=$(echo "$LINE" | awk '{print $1}')
            FNAME=$(echo "$LINE" | awk '{print $2}')
            echo "  picked index=$IDX  file=$FNAME"
            mkdir -p "d$ID"
            aria2c --dir="d$ID" --select-file="$IDX" --allow-overwrite=true \
              --auto-file-renaming=false --file-allocation=none --bt-enable-lpd=true \
              --bt-tracker="udp://tracker.opentrackr.org:1337/announce" \
              --bt-tracker="udp://open.stealth.si:80/announce" \
              --bt-tracker="udp://tracker.torrent.eu.org:451/announce" \
              --bt-tracker="udp://exodus.desync.com:6969/announce" \
              --bt-tracker="udp://tracker.coppersurfer.tk:6969/announce" \
              --connect-timeout=30 --timeout=60 --summary-interval=20 \
              --console-log-level=warn --log="$ID.aria2.log" \
              "$ID.torrent" > /dev/null 2>&1 &
            ARIA_PID=$!
            echo "  aria2 pid $ARIA_PID, waiting for completion"
            DEADLINE=$(( $(date +%s) + MAXWAIT ))
            while [ "$(date +%s)" -lt "$DEADLINE" ]; do
              if ! kill -0 "$ARIA_PID" 2>/dev/null; then break; fi
              sleep 5
            done
            kill "$ARIA_PID" 2>/dev/null || true
            wait "$ARIA_PID" 2>/dev/null || true
            echo "  --- files on disk ---"
            find "d$ID" -type f -printf '    %12s  %f\n' | sort -k2 | head -10
            FOUND=$(find "d$ID" -type f -size +10M | head -1)
            if [ -z "$FOUND" ]; then
              echo "  !! no episode file downloaded (no live peers?)"
              tail -12 "$ID.aria2.log" 2>/dev/null | sed 's/^/     /'
              continue
            fi
            echo "  probing: $FOUND ($(stat -c%s "$FOUND") bytes)"
            {
              echo ""
              echo "### candidate $ID"
              echo "- file: $FNAME"
              echo ""
              echo '```'
              ffprobe -v error -show_entries stream=index,codec_type,codec_name,width,height:stream_tags=language,title -of default=nw=1 "$FOUND"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "  --- all streams ---"
            ffprobe -v error -show_entries stream=index,codec_type,codec_name,width,height:stream_tags=language,title -of default=nw=1 "$FOUND" | sed 's/^/     /'
            echo "  --- subtitle tracks only ---"
            ffprobe -v error -select_streams s -show_entries stream=index,codec_name:stream_tags=language,title -of default=nw=1 "$FOUND" | sed 's/^/     /'
            echo "  --- extract every subtitle track to srt ---"
            mkdir -p srt
            NS=$(ffprobe -v error -select_streams s -show_entries stream=index -of csv=p=0 "$FOUND" | wc -l)
            echo "     subtitle stream count: $NS"
            for S in $(ffprobe -v error -select_streams s -show_entries stream=index -of csv=p=0 "$FOUND"); do
              LANG=$(ffprobe -v error -select_streams "s:$S" -show_entries stream_tags=language,title -of default=nw=1 "$FOUND" | tr '\n' ' ')
              ffmpeg -v error -y -i "$FOUND" -map "0:$S" "srt/${ID}_s${S}.srt" 2>&1 | head -2 || true
              SZ=$(stat -c%s "srt/${ID}_s${S}.srt" 2>/dev/null || echo 0)
              echo "     stream $S  tags=[$LANG]  extracted=${SZ}B"
            done
            ls -l srt/ | tail -8 | sed 's/^/     /'
            STEM="frames/${ID}"
            ffmpeg -v error -y -ss 420 -i "$FOUND" -frames:v 1 "${STEM}_a.png" 2>&1 | head -2 || true
            ffmpeg -v error -y -ss 1200 -i "$FOUND" -frames:v 1 "${STEM}_b.png" 2>&1 | head -2 || true
            ls -l frames/ | tail -6 | sed 's/^/     /'
            rm -rf "d$ID"
          done
          echo ""
          echo "### frames"
          ls -l frames/ | sed 's/^/  /'
          echo "### srt"
          ls -l srt/ | sed 's/^/  /'

      - name: Upload frames and srt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subtitle-probe
          path: |
            /tmp/probe/frames/
            /tmp/probe/srt/
          if-no-files-found: ignore
