name: Probe Subtitle Tracks

on:
  workflow_dispatch:
    inputs:
      candidates:
        description: 'Comma separated nyaa torrent IDs to probe'
        required: false
        default: '1299586,1470445,1681123,2091897'
      episode:
        description: 'Regex to pick the episode file inside each torrent'
        required: false
        default: 'S01E01'

permissions:
  contents: read

jobs:
  probe:
    name: Probe subtitle tracks
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report runner tools
        run: |
          echo "### Runner tools" >> "$GITHUB_STEP_SUMMARY"
          { echo "- ffmpeg: $(ffmpeg -version 2>/dev/null | head -1 || echo MISSING)"; \
            echo "- ffprobe: $(ffprobe -version 2>/dev/null | head -1 || echo MISSING)"; \
            echo "- aria2c: $(aria2c --version 2>/dev/null | head -1 || echo MISSING)"; \
            echo "- free space:"; df -h / /tmp | sed 's/^/  /'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Install aria2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2
          aria2c --version | head -1

      - name: Write torrent parser
        run: |
          cat > /tmp/tinfo.py <<'PYEOF'
          import sys, json
          def dec(b, i=0):
              c = b[i:i+1]
              if c == b'i':
                  j = b.index(b'e', i); return int(b[i+1:j]), j + 1
              if c == b'l':
                  i += 1; out = []
                  while b[i:i+1] != b'e':
                      v, i = dec(b, i); out.append(v)
                  return out, i + 1
              if c == b'd':
                  i += 1; out = {}
                  while b[i:i+1] != b'e':
                      k, i = dec(b, i); v, i = dec(b, i); out[k] = v
                  return out, i + 1
              j = b.index(b':', i); n = int(b[i:j]); return b[j+1:j+1+n], j + 1 + n
          data = open(sys.argv[1], 'rb').read()
          d, _ = dec(data)
          info = d[b'info']
          files = []
          if b'files' in info:
              for f in info[b'files']:
                  files.append({'path': b'/'.join(f[b'path']).decode('utf-8', 'replace'),
                                'size': f[b'length']})
          else:
              files.append({'path': info.get(b'name', b'?').decode('utf-8', 'replace'),
                            'size': info[b'length']})
          print(json.dumps({'name': info.get(b'name', b'?').decode('utf-8', 'replace'),
                            'files': files}))
          PYEOF

      - name: Probe each candidate
        env:
          CANDIDATES: ${{ inputs.candidates }}
          EPISODE: ${{ inputs.episode }}
        run: |
          set -u
          mkdir -p /tmp/probe
          cd /tmp/probe
          for ID in ${CANDIDATES//,/ }; do
            ID=$(echo "$ID" | tr -d ' ')
            [ -z "$ID" ] && continue
            echo "================= candidate $ID ================="
            curl -sSL --max-time 90 -A "Mozilla/5.0" "https://nyaa.si/download/$ID.torrent" -o "$ID.torrent" || true
            if [ ! -s "$ID.torrent" ]; then
              echo "  !! torrent fetch failed"
              continue
            fi
            python3 /tmp/tinfo.py "$ID.torrent" > "$ID.json" || { echo "  !! parse failed"; continue; }
            NAME=$(python3 -c "import json;print(json.load(open('$ID.json'))['name'])")
            echo "  torrent name: $NAME"
            python3 - "$ID.json" "$EPISODE" <<'PYEOF' > "$ID.pick"
          import json, re, sys
          d = json.load(open(sys.argv[1]))
          pat = re.compile(sys.argv[2], re.I)
          hits = [(i, f) for i, f in enumerate(d['files'], 1) if pat.search(f['path'])]
          if not hits:
              hits = [(i, f) for i, f in enumerate(d['files'], 1) if re.search(r'S01E0?1\b', f['path'], re.I)]
          if not hits:
              hits = [(1, d['files'][0])]
          i, f = hits[0]
          print(i)
          print(f['path'])
          print(f['size'])
          PYEOF
            IDX=$(sed -n 1p "$ID.pick"); FNAME=$(sed -n 2p "$ID.pick"); FSIZE=$(sed -n 3p "$ID.pick")
            echo "  picking file #$IDX  $FNAME  ($FSIZE bytes)"
            mkdir -p "d$ID"
            timeout 2400 aria2c \
              --dir="d$ID" \
              --select-file="$IDX" \
              --allow-overwrite=true \
              --auto-file-renaming=false \
              --file-allocation=none \
              --bt-enable-lpd=true \
              --bt-tracker="udp://tracker.opentrackr.org:1337/announce" \
              --bt-tracker="udp://open.stealth.si:80/announce" \
              --bt-tracker="udp://tracker.torrent.eu.org:451/announce" \
              --bt-tracker="udp://exodus.desync.com:6969/announce" \
              --bt-tracker="udp://tracker.coppersurfer.tk:6969/announce" \
              --connect-timeout=30 \
              --timeout=60 \
              --summary-interval=30 \
              --console-log-level=warn \
              --log="$ID.aria2.log" \
              "$ID.torrent" 2>&1 | tail -5 || echo "  !! aria2 exited non zero"
            FOUND=$(find "d$ID" -type f \( -name '*.mkv' -o -name '*.mp4' -o -name '*.avi' \) | head -1)
            if [ -z "$FOUND" ]; then
              echo "  !! no episode file downloaded (no live peers?)"
              tail -12 "$ID.aria2.log" 2>/dev/null | sed 's/^/     /'
              continue
            fi
            echo "  downloaded: $FOUND ($(stat -c%s "$FOUND") bytes)"
            {
              echo ""
              echo "### candidate $ID"
              echo "- torrent: $NAME"
              echo "- file: $FNAME"
              echo ""
              echo '```'
              ffprobe -v error -show_entries stream=index,codec_type,codec_name,width,height:stream_tags=language,title -of default=nw=1 "$FOUND"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "  --- streams ---"
            ffprobe -v error -show_entries stream=index,codec_type,codec_name:stream_tags=language,title -of default=nw=1 "$FOUND" | sed 's/^/     /'
            mkdir -p frames
            BASE=$(basename "$FOUND")
            ffmpeg -v error -y -ss 300 -i "$FOUND" -frames:v 1 "frames/${ID}_${BASE%.*}.png" 2>&1 | head -3 || true
            ffmpeg -v error -y -ss 900 -i "$FOUND" -frames:v 1 "frames/${ID}_${BASE%.*}_900.png" 2>&1 | head -3 || true
            ls -l frames/ | tail -4 | sed 's/^/     /'
            rm -rf "d$ID"
          done
          echo ""
          echo "### frames"
          ls -l frames/ | sed 's/^/  /'

      - name: Upload frames
        uses: actions/upload-artifact@v4
        with:
          name: subtitle-probe-frames
          path: /tmp/probe/frames/
          if-no-files-found: ignore
