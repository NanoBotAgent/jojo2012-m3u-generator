name: Probe Subtitle Tracks

on:
  workflow_dispatch:
    inputs:
      candidates:
        description: 'Comma separated nyaa torrent IDs to probe'
        required: false
        default: '1681123'
      maxwait:
        description: 'Seconds to wait for the episode file to complete'
        required: false
        default: '1500'

permissions:
  contents: read

jobs:
  probe:
    name: Probe subtitle tracks
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg and aria2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg aria2
          echo "ffprobe: $(command -v ffprobe || echo MISSING)"
          aria2c --version | head -1
          ffprobe -version 2>/dev/null | head -1
          df -h / /tmp | sed 's/^/  /'

      - name: Probe each candidate
        env:
          CANDIDATES: ${{ inputs.candidates }}
          MAXWAIT: ${{ inputs.maxwait }}
        run: |
          set -u
          mkdir -p /tmp/probe/frames /tmp/probe/srt
          cd /tmp/probe
          for ID in ${CANDIDATES//,/ }; do
            ID=$(echo "$ID" | tr -d ' ')
            [ -z "$ID" ] && continue
            echo "================= candidate $ID ================="
            curl -sSL --max-time 90 -A "Mozilla/5.0" "https://nyaa.si/download/$ID.torrent" -o "$ID.torrent" || true
            if [ ! -s "$ID.torrent" ]; then
              echo "  !! torrent fetch failed"
              continue
            fi
            aria2c --show-files "$ID.torrent" 2>/dev/null > "$ID.files"
            echo "  --- episode 1 lines in listing ---"
            grep -nE "S01E01| - 01\.mkv" "$ID.files" | head -4 | cut -c1-200 | sed 's/^/    /'
            python3 - "$ID.files" <<'PYEOF' > "$ID.pick"
          import re, sys
          rows = []
          for line in open(sys.argv[1], encoding='utf-8', errors='replace'):
              line = line.rstrip('\n')
              if '|' not in line:
                  continue
              head, path = line.split('|', 1)
              head = head.strip()
              if not head.isdigit():
                  continue
              rows.append((int(head), path.strip()))
          excl = re.compile(r'OVA|NCOP|NCED|Promo|Special|Extra|Menu|Preview', re.I)
          def ok(p):
              return not excl.search(p)
          picked = None
          for pat in (r'S01E0?1\b', r' - 0?1\.mkv$'):
              cand = [r for r in rows if re.search(pat, r[1], re.I) and ok(r[1])]
              if cand:
                  picked = cand[0]
                  break
          if picked is None:
              cand = [r for r in rows if ok(r[1]) and r[1].lower().endswith('.mkv')]
              if cand:
                  picked = cand[0]
          if picked is None:
              print('NONE')
              raise SystemExit
          print(picked[0])
          print(picked[1])
          print(picked[1].split('/')[-1])
          PYEOF
            IDX=$(sed -n 1p "$ID.pick")
            if [ "$IDX" = "NONE" ]; then
              echo "  !! no episode file found in listing"
              continue
            fi
            FNAME=$(sed -n 2p "$ID.pick")
            BASENAME=$(sed -n 3p "$ID.pick")
            echo "  picked index=$IDX"
            echo "  path=$FNAME"
            mkdir -p "d$ID"
            aria2c --dir="d$ID" --select-file="$IDX" \
              --allow-overwrite=true --auto-file-renaming=false --file-allocation=none \
              --bt-enable-lpd=true --follow-torrent=mem --seed-time=0 \
              --bt-tracker="udp://tracker.opentrackr.org:1337/announce" \
              --bt-tracker="udp://open.stealth.si:80/announce" \
              --bt-tracker="udp://tracker.torrent.eu.org:451/announce" \
              --bt-tracker="udp://exodus.desync.com:6969/announce" \
              --bt-tracker="udp://tracker.coppersurfer.tk:6969/announce" \
              --connect-timeout=30 --timeout=60 --summary-interval=20 \
              --console-log-level=warn --log="$ID.aria2.log" --log-level=info \
              "$ID.torrent" > "$ID.aria2.out" 2>&1 &
            ARIA_PID=$!
            DEADLINE=$(( $(date +%s) + MAXWAIT ))
            while [ "$(date +%s)" -lt "$DEADLINE" ]; do
              if ! kill -0 "$ARIA_PID" 2>/dev/null; then break; fi
              sleep 5
            done
            kill "$ARIA_PID" 2>/dev/null || true
            wait "$ARIA_PID" 2>/dev/null || true
            echo "  --- aria2 result ---"
            grep -E "OK  \||ERR|error" "$ID.aria2.out" | head -4 | cut -c1-200 | sed 's/^/    /'
            echo "  --- files on disk ---"
            find "d$ID" -type f -printf '    %12s  %f\n' | sort -k2 | head -12
            FOUND=$(find "d$ID" -type f -name "*.mkv" -printf '%s\t%p\n' \
              | awk -F'\t' '$1 > 100000000 && ($2 ~ / - 0?1\.mkv$/ || $2 ~ /S01E0?1\.mkv$/) {print $2; exit}')
            if [ -z "$FOUND" ]; then
              FOUND=$(find "d$ID" -type f -name "*.mkv" -printf '%s\t%p\n' \
                | awk -F'\t' '$1 > 100000000 {print $2; exit}')
            fi
            if [ -z "$FOUND" ]; then
              echo "  !! no episode file on disk"
              continue
            fi
            echo "  probing: $FOUND ($(stat -c%s "$FOUND") bytes)"
            {
              echo ""
              echo "### candidate $ID"
              echo "- file: $FOUND"
              echo ""
              echo '```'
              ffprobe -v error -show_entries stream=index,codec_type,codec_name,width,height:stream_tags=language,title -of default=nw=1 "$FOUND" 2>&1 | head -40
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "  --- all streams ---"
            ffprobe -v error -show_entries stream=index,codec_type,codec_name,width,height:stream_tags=language,title -of default=nw=1 "$FOUND" 2>&1 | head -40 | sed 's/^/     /'
            echo "  --- subtitle tracks only ---"
            ffprobe -v error -select_streams s -show_entries stream=index,codec_name:stream_tags=language,title -of default=nw=1 "$FOUND" 2>&1 | head -30 | sed 's/^/     /'
            echo "  --- extract + sample subtitle tracks ---"
            for S in $(ffprobe -v error -select_streams s -show_entries stream=index -of csv=p=0 "$FOUND" 2>/dev/null); do
              TAGS=$(ffprobe -v error -select_streams "s:$S" -show_entries stream_tags=language,title -of default=nw=1 "$FOUND" 2>/dev/null | tr '\n' ' ')
              ffmpeg -v error -y -i "$FOUND" -map "0:$S" "srt/${ID}_s${S}.srt" >/dev/null 2>&1 || true
              SZ=$(stat -c%s "srt/${ID}_s${S}.srt" 2>/dev/null || echo 0)
              echo "     stream $S  tags=[$TAGS]  extracted=${SZ}B"
              if [ "$SZ" -gt 200 ]; then
                echo "       first dialogue lines:"
                sed -n '1,24p' "srt/${ID}_s${S}.srt" | grep -vE '^[0-9]+$|^$' | head -4 | sed 's/^/         /'
              fi
            done
            STEM="frames/${ID}"
            ffmpeg -v error -y -ss 420 -i "$FOUND" -frames:v 1 "${STEM}_a.png" >/dev/null 2>&1 || true
            ffmpeg -v error -y -ss 1200 -i "$FOUND" -frames:v 1 "${STEM}_b.png" >/dev/null 2>&1 || true
            ls -l frames/ | tail -6 | sed 's/^/     /'
            rm -rf "d$ID"
          done
          echo ""
          echo "### frames"; ls -l frames/ | sed 's/^/  /'
          echo "### srt";   ls -l srt/   | sed 's/^/  /'
          true

      - name: Upload frames and srt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subtitle-probe
          path: |
            /tmp/probe/frames/
            /tmp/probe/srt/
          if-no-files-found: ignore
