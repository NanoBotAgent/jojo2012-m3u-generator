name: Test Dispatch

on:
  workflow_dispatch:
    inputs:
      test_input:
        description: 'Test input'
        required: false
        default: 'hello'
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Echo input
        run: |
          echo "Test input: ${{ inputs.test_input }}"
