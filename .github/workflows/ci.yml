name: CI

on:
  push:
    branches: [main, Latest, master]
  pull_request:
    branches: [main, Latest, master]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build --no-daemon

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Run GameTests
        run: ./gradlew runGametest --no-daemon

      - name: Validate resources
        run: ./gradlew :validateResources --no-daemon

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uncannyvoxel-build
          path: build/libs/*.jar
          retention-days: 7

  ci-verification-gate:
    name: CI Verification Gate
    runs-on: ubuntu-latest
    needs: build-and-test
    if: always()
    timeout-minutes: 10

    steps:
      - name: Check build-and-test job status
        run: |
          if [ "${{ needs.build-and-test.result }}" != "success" ]; then
            echo "CI verification gate FAILED: build-and-test job did not succeed"
            exit 1
          fi
          echo "CI verification gate PASSED: all tests and build succeeded"

  lint-and-validate:
    name: Lint and Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Validate Gradle wrapper
        run: ./gradlew wrapper --gradle-version 8.7

      - name: Check for common issues
        run: |
          # Check for TODO/FIXME in production code
          if grep -r "TODO\|FIXME" src/main --include="*.java" | grep -v test; then
            echo "WARNING: TODO/FIXME comments found in production code"
          fi

          # Check mixin targets have require = 0 for unverified 26.2 classes
          if grep -r "require = 1" src/main/resources/uncannyvoxel.mixins.json; then
            echo "ERROR: Some mixins require = 1 for unverified targets"
            exit 1
          fi
